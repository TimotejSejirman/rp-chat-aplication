<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <title>Výzva na DrugWipe</title>
    <style>
        html,
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(31, 35, 42, 0.95);
            padding: 20px;
            border-radius: 8px;
            width: 340px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .checkbox-group {
            text-align: left;
            margin: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-accept {
            background: #2ecc71;
            color: #fff;
        }

        .btn-decline {
            background: #e74c3c;
            color: #fff;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>
    <div class="box" id="promptBox">
        <h3 id="policeText">Policajt vám zaslal DrugWipe test.</h3>
        <p>Prajete si test prijať?</p>
        <button class="btn-accept" onclick="acceptTest()">Prijať</button>
        <button class="btn-decline" onclick="declineTest()">Odmietnuť</button>
    </div>

    <div class="box" id="inputBox" style="display:none;">
        <h3>DrugWipe test</h3>
        <p style="font-size:12px; color:#aaa;">Zaškrtnite položky (ak nie je nič zaškrtnuté, výsledok bude negatívny):
        </p>
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="chk_thc"> THC - Amfetamín / Metamfetamín</label>
            <label class="checkbox-item"><input type="checkbox" id="chk_coc"> COC - Kokain</label>
            <label class="checkbox-item"><input type="checkbox" id="chk_opp"> OPP - Opioidy</label>
        </div>
        <button class="btn-accept" onclick="sendValue()">Odoslať</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const firebaseConfig = {
            apiKey: "AIzaSyBuxsqmHcgsGb3zvRIX6TvuRQ9Tc9JQVc8",
            authDomain: "rp-chat-slovakcity.firebaseapp.com",
            databaseURL: "https://rp-chat-slovakcity-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "rp-chat-slovakcity"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRequestData = null;

        ipcRenderer.on('init-drugwipe-target', (event, data) => {
            currentRequestData = data;
            document.getElementById('policeText').innerText = `Policajt ${data.officer} vám zaslal DrugWipe test.`;
        });

        function acceptTest() {
            document.getElementById('promptBox').style.display = 'none';
            document.getElementById('inputBox').style.display = 'block';
        }

        function declineTest() {
            if (currentRequestData) {
                db.ref(`drugwipe_requests/${currentRequestData.requestId}`).update({ status: "declined" });
                db.ref("global_messages").push({
                    sender: localStorage.getItem("rp_roblox_username") || "Hráč",
                    text: `odmietol DrugWipe test od policajta ${currentRequestData.officer}.`,
                    timestamp: Date.now()
                });
            }
            window.close();
        }

        function sendValue() {
            const selected = [];
            if (document.getElementById('chk_thc').checked) selected.push("THC");
            if (document.getElementById('chk_coc').checked) selected.push("COC");
            if (document.getElementById('chk_opp').checked) selected.push("OPP");

            if (currentRequestData) {
                db.ref(`drugwipe_requests/${currentRequestData.requestId}`).update({ status: "accepted", values: selected });
                db.ref("global_messages").push({
                    sender: localStorage.getItem("rp_roblox_username") || "Hráč",
                    text: `dokončil DrugWipe test od policajta ${currentRequestData.officer}.`,
                    timestamp: Date.now()
                });

                ipcRenderer.send('open-drugwipe-result-window', selected);
            }
            window.close();
        }
    </script>
</body>

</html>
