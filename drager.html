<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <title>Dräger Alcotest 7510</title>
    <style>
        html,
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            background: rgba(17, 17, 17, 0.95);
            /* Samotný box bude jemne priesvitný/tmavý, ale okolie bude transparentné */
            border: 2px solid #333;
            border-radius: 12px;
            width: 400px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h2 {
            color: #f39c12;
            margin-bottom: 15px;
        }

        .result-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
        }

        .warning {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .footer-text {
            font-size: 11px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Dräger Alcotest 7510</h2>
        <div class="result-box">
            <div class="value" id="resultValue">0.00 ‰</div>
            <div class="warning" id="warningBox">Výsledok merania</div>
        </div>
        <div class="footer-text">Automaticky sa zavrie za 8 sekúnd alebo stlačte ESC</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('set-result-value', (event, val) => {
            document.getElementById('resultValue').innerText = val + " ‰";
            const valNum = parseFloat(val);

            const box = document.getElementById('warningBox');

            if (valNum === 0) {
                box.innerText = "V limite";
                box.style.borderColor = "#2ecc71";
                box.style.color = "#2ecc71";
                box.style.background = "rgba(46, 204, 113, 0.2)";
            }

            else if (valNum > 0 && valNum <= 0.20) {
                box.innerText = "Mierne nad zákonným limitom!";
                box.style.borderColor = "#f1c40f";
                box.style.color = "#f1c40f";
                box.style.background = "rgba(241, 196, 15, 0.2)";
            }

            else if (valNum > 0.20) {
                box.innerText = "Prekročený zákonný limit!";
                box.style.borderColor = "#e74c3c";
                box.style.color = "#e74c3c";
                box.style.background = "rgba(231, 76, 60, 0.2)";
            }

        });

        setTimeout(() => { window.close(); }, 8000);
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
    </script>
</body>

</html>
