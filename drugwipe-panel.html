<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <title>Panel pre DrugWipe test</title>
    <style>
        html,
        body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: rgba(31, 35, 42, 0.95);
            padding: 20px;
            border-radius: 8px;
            width: 340px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h3 {
            color: #f39c12;
            margin-top: 0;
        }

        select,
        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            background: #2ecc71;
            color: #fff;
            width: 95%;
        }

        button:hover {
            background: #27ae60;
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
        }

        .success {
            color: #2ecc71;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>
    <div class="box">
        <h3>DrugWipe Test</h3>
        <label for="targetSelect">Vyberte hráča:</label>
        <select id="targetSelect">
            <option value="">Načítavam online hráčov...</option>
        </select>
        <label for="passwordInput">Zadajte heslo:</label>
        <input type="password" id="passwordInput" placeholder="Heslo drugwipe">
        <button onclick="sendDrugwipeRequest()">Odoslať výzvu</button>
        <div id="msg" class="error"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const firebaseConfig = {
            apiKey: "AIzaSyBuxsqmHcgsGb3zvRIX6TvuRQ9Tc9JQVc8",
            authDomain: "rp-chat-slovakcity.firebaseapp.com",
            databaseURL: "https://rp-chat-slovakcity-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "rp-chat-slovakcity"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUsername = localStorage.getItem("rp_roblox_username") || "";
        const targetSelect = document.getElementById('targetSelect');

        db.ref("users").on("value", (snap) => {
            const val = snap.val();
            targetSelect.innerHTML = "";
            if (val) {
                // Odstránili sme podmienku, ktorá ťa vynechávala zo zoznamu
                const onlineUsers = Object.values(val).filter(u => u.status === "approved");
                if (onlineUsers.length > 0) {
                    onlineUsers.forEach(user => {
                        let opt = document.createElement('option');
                        opt.value = user.username;
                        opt.innerText = user.username;
                        targetSelect.appendChild(opt);
                    });
                    return;
                }
            }
            let opt = document.createElement('option');
            opt.value = "";
            opt.innerText = "Žiadni online hráči";
            targetSelect.appendChild(opt);
        });

        function sendDrugwipeRequest() {
            const targetUser = targetSelect.value;
            const password = document.getElementById('passwordInput').value;
            const msgDiv = document.getElementById('msg');

            if (!targetUser) { msgDiv.innerText = "Vyberte platného hráča!"; return; }
            if (password !== "DrugwipeTestS") {
                msgDiv.className = "error";
                msgDiv.innerText = "Nesprávne heslo!";
                return;
            }

            db.ref("drugwipe_requests").push({
                officer: localStorage.getItem("rp_roblox_username") || "Policajt",
                target: targetUser,
                status: "pending",
                timestamp: Date.now()
            });

            msgDiv.className = "success";
            msgDiv.innerText = "Výzva úspešne odoslaná.";
            setTimeout(() => { window.close(); }, 1500);
        }
    </script>
</body>

</html>
